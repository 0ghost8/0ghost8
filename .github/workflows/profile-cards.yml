name: Update profile cards

on:
  push:
    branches: [main]
    paths:
      - README.md
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Render public GitHub activity
        uses: stats-organization/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: stats
          options: username=0ghost8&show_icons=true&hide_rank=true&hide=contribs&locale=es&bg_color=0D1117&title_color=A78BFA&icon_color=67E8F9&text_color=C9D1D9&border_color=303047&border_radius=16&card_width=440&custom_title=Actividad%20de%200ghost8
          path: assets/github-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render public repository languages
        uses: stats-organization/github-readme-stats-action@27f3601ffd7302c6ffaefb472ba8383d2a296e3f # v1
        with:
          card: top-langs
          options: username=0ghost8&layout=compact&langs_count=6&locale=es&bg_color=0D1117&title_color=A78BFA&text_color=C9D1D9&border_color=303047&border_radius=16&card_width=440&custom_title=Lenguajes%20en%20mis%20repositorios
          path: assets/top-languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep the last successful cards if generation fails
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          for (const path of ['assets/github-stats.svg', 'assets/top-languages.svg']) {
            const svg = readFileSync(path, 'utf8');
            if (!svg.includes('<svg') || /something went wrong|could not fetch|api rate limit|maximum retries|could not resolve/i.test(svg)) {
              throw new Error('Card generation failed: ' + path);
            }
          }
          NODE

      - name: Publish updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/top-languages.svg
          if git diff --cached --quiet; then
            echo "Profile cards are already current."
            exit 0
          fi
          git commit -m "chore: refresh public profile cards"
          git pull --rebase origin main
          git push origin HEAD:main
